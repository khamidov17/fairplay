<script src="{{ static('rich_editor.js') }}{% if DMOJ_STATIC_VERSION %}?v={{ DMOJ_STATIC_VERSION }}{% endif %}"></script>
<script>
  function rtePaintTargets() {
    if (window.RichEditor && typeof RichEditor.paintTargets === 'function') {
      RichEditor.paintTargets();
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', rtePaintTargets);
  } else {
    rtePaintTargets();
  }
</script>

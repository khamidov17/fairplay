<script type="text/javascript">
    // The sebs:// href carries a token signed when this page rendered. A student
    // who opened the exam page well before the start time would click a token
    // that has since expired, so re-mint one on click and use that instead.
    // Any failure falls through to the rendered href, which still works inside
    // the token's lifetime and needs no JavaScript.
    (function () {
        function bind(link) {
            link.addEventListener('click', function (event) {
                var tokenUrl = link.getAttribute('data-seb-token-url');
                if (!tokenUrl || !window.fetch || link.dataset.sebRefreshed === '1') return;
                event.preventDefault();
                fetch(tokenUrl, {credentials: 'same-origin'})
                    .then(function (response) {
                        if (!response.ok) throw new Error(response.status);
                        return response.json();
                    })
                    .then(function (data) {
                        if (data && data.url) link.href = data.url;
                    })
                    .catch(function () { /* keep the rendered href */ })
                    .then(function () {
                        // Guard against re-entering this handler for the click
                        // we are about to replay.
                        link.dataset.sebRefreshed = '1';
                        link.click();
                        link.dataset.sebRefreshed = '';
                    });
            });
        }

        var links = document.querySelectorAll('a[data-seb-token-url]');
        for (var i = 0; i < links.length; i++) bind(links[i]);
    })();
</script>

{% extends "base.html" %}

{% block media %}
    <style>
        #seb-quit {
            margin: 80px auto 0;
            display: block;
            max-width: 560px;
            text-align: center;
        }
    </style>
{% endblock %}

{% block body %}
    <div id="seb-quit">
        <h2>{{ _('Exam finished') }}</h2>
        <p>{{ _('You may now close Safe Exam Browser. If it does not close automatically, use the quit button in the SEB toolbar.') }}</p>
    </div>
{% endblock %}

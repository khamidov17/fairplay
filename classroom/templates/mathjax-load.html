<script type="text/javascript" src="{{ static('libs/mathjax/es5/tex-chtml.js') }}"></script>
<script type="text/javascript">
    if (window.MathJax && typeof MathJax.typesetPromise === 'function') {
        MathJax.typesetPromise().then(function () {
            $('.tex-image').hide();
            $('.tex-text').show();
        });
    }
</script>

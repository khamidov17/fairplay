# DKUOJ (site) CI/CD — GitLab CI port + modernization.
# Replaces the former GitHub Actions in .github/workflows/.
#
# Pipeline:  lint -> test -> build (image) -> backup (manual) -> deploy
#   * lint/styles/test run on OIT shared Docker runners.
#   * build-image pushes the site image to the GitLab Container Registry.
#   * deploy:* run on the dedicated, project-locked runner on the DEV server
#     (tag: dku-deploy). deploy:dev acts locally; deploy:prod SSHes to prod.

stages:
  - lint
  - test
  - build
  - backup
  - deploy
  - review

variables:
  GIT_SUBMODULE_STRATEGY: recursive          # pulls resources/libs (site-assets)
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DKUOJ_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

default:
  interruptible: true                        # auto-cancel superseded pipelines

# Run for MRs and for branch/tag pushes, but never double up a branch pipeline
# when an MR is already open for that branch.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# lint
# ---------------------------------------------------------------------------
lint:
  stage: lint
  image: python:3.11
  script:
    - pip install flake8 flake8-import-order flake8-future-import flake8-commas flake8-logging-format flake8-quotes flake8-gl-codeclimate
    - flake8 --version
    # One run feeds both the gate (non-zero exit on findings) and the GitLab
    # Code Quality widget; --tee also echoes the report to the job log.
    - flake8 --format gl-codeclimate --output-file gl-code-quality-report.json --tee
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 1 week

styles:
  stage: lint
  image: node:20
  script:
    - npm install -g sass postcss-cli postcss autoprefixer
    - npm ci
    - npm run build:editor
    - npm run test:editor
    - test -s resources/rich_editor.js
    - test -s resources/vendor/katex.min.css
    - test -d resources/vendor/fonts
    - ./make_style.sh

# ---------------------------------------------------------------------------
# test (matrix py3.11 / py3.12, MySQL service, GitLab-native coverage)
# ---------------------------------------------------------------------------
test:
  stage: test
  image: $PY_IMAGE
  parallel:
    matrix:
      - PY_IMAGE: ["python:3.11", "python:3.12"]
  services:
    # The OIT shared runners (docker+machine, ci-shared-*.oit.duke.edu) run on
    # CPUs without the x86-64-v2 baseline. The official mysql:8 image is built on
    # Oracle Linux 9, whose glibc requires x86-64-v2, so it aborts on start there
    # ("Fatal glibc error: CPU does not support x86-64-v2") and the DB never comes
    # up. MariaDB's images are Ubuntu-based (x86-64-v1), run fine on these CPUs,
    # are wire-compatible with mysqlclient, and are a first-class DMOJ database.
    - name: mariadb:11
      alias: mysql
  variables:
    MYSQL_DATABASE: dmoj
    MYSQL_ROOT_PASSWORD: root
    MARIADB_DATABASE: dmoj
    MARIADB_ROOT_PASSWORD: root
    # docker+machine executor → the service is a separate container, reached by
    # its alias (`mysql`), not 127.0.0.1.
    DB_HOST: mysql
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config
    - pip install wheel
    - pip install -r requirements.txt
    - pip install mysqlclient coverage unittest-xml-reporting
    # GitLab already health-checks the service before the job starts; this is a
    # small extra guard that MariaDB is accepting connections before we create
    # the test database.
    - for i in $(seq 1 60); do (echo > /dev/tcp/mysql/3306) 2>/dev/null && break; sleep 1; done
    - cp .ci.settings.py dmoj/local_settings.py
    # Views that render base.html call inlinei18n(), which reads the compiled jsi18n catalog from
    # STATIC_ROOT. Without this the template raises FileNotFoundError and every page-rendering test
    # errors out before its assertion.
    - python manage.py compilejsi18n
  script:
    # Fail fast on a split migration graph. Two branches numbering off the same parent leave
    # judge/migrations with two leaves, and then every `migrate` — including the one in
    # docker/entrypoint.sh on deploy — aborts before applying anything. Reads the graph off
    # disk only, so it costs seconds and needs no database.
    - python manage.py check_migration_graph judge
    # XMLTestRunner (configured in .ci.settings.py) writes test-reports/TEST-*.xml.
    - coverage run --source=. manage.py test judge
    - coverage xml
    - coverage report
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    # always: upload the JUnit + coverage reports even when tests fail — that is
    # exactly the run whose per-test results we want in the MR.
    when: always
    reports:
      junit: test-reports/*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# build image (Kaniko — no privileged runner required)
# Builds two targets from one Dockerfile: the Python app and the Node wsevent.
# ---------------------------------------------------------------------------
.build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

build-web:
  extends: .build-image
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --target web
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

build-wsevent:
  extends: .build-image
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --target wsevent
      --destination "$CI_REGISTRY_IMAGE/wsevent:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/wsevent:$CI_COMMIT_REF_SLUG"

# ---------------------------------------------------------------------------
# deploy (run on the dev-server shell runner; tag: dku-deploy)
# ---------------------------------------------------------------------------
.deploy:
  stage: deploy
  tags:
    - dku-deploy
  variables:
    GIT_SUBMODULE_STRATEGY: none
    DATA_DIR: /srv/dkuoj                      # holds .env, local_settings.py, static/
  # No per-job `docker login` here: the deploy runner runs as the `deploy` user on
  # the dev host, which holds a persisted registry credential from a one-time login
  # with a read_registry deploy token. So `docker compose pull` authenticates without
  # rewriting ~/.docker/config.json every run (that write is what previously failed).

deploy:dev:
  extends: .deploy
  environment:
    name: dev
    url: http://10.200.14.8
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    # Runs locally on the dev host where this runner lives.
    - export DKUOJ_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - export WSEVENT_IMAGE="$CI_REGISTRY_IMAGE/wsevent:$CI_COMMIT_SHORT_SHA"
    - docker compose --env-file "$DATA_DIR/.env" -f docker-compose.yml pull
    - docker compose --env-file "$DATA_DIR/.env" -f docker-compose.yml up -d --remove-orphans

backup:prod:
  extends: .deploy
  stage: backup
  environment:
    name: production
    url: https://oj.dukekunshan.edu.cn
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true                    # optional; deploy remains independently runnable
  script:
    # S3 settings are protected, production-scoped CI/CD variables. Build a
    # short-lived env file locally, stream it over SSH, and delete both copies
    # on every exit. Variable values never appear in the SSH command line.
    - |
      set +x
      : "${BACKUP_S3_ENDPOINT_URL:?missing BACKUP_S3_ENDPOINT_URL}"
      : "${BACKUP_S3_REGION:?missing BACKUP_S3_REGION}"
      : "${BACKUP_S3_BUCKET:?missing BACKUP_S3_BUCKET}"
      : "${BACKUP_S3_ACCESS_KEY_ID:?missing BACKUP_S3_ACCESS_KEY_ID}"
      : "${BACKUP_S3_SECRET_ACCESS_KEY:?missing BACKUP_S3_SECRET_ACCESS_KEY}"
      s3_env="$(mktemp)"
      remote_script="/tmp/dkuoj-backup-${CI_PIPELINE_ID}.sh"
      cleanup() { rm -f "$s3_env"; }
      trap cleanup EXIT HUP INT TERM
      umask 077
      {
        printf 'BACKUP_S3_ENDPOINT_URL=%s\n' "$BACKUP_S3_ENDPOINT_URL"
        printf 'BACKUP_S3_REGION=%s\n' "$BACKUP_S3_REGION"
        printf 'BACKUP_S3_BUCKET=%s\n' "$BACKUP_S3_BUCKET"
        printf 'BACKUP_S3_PREFIX=%s\n' "${BACKUP_S3_PREFIX:-dkuoj-production}"
        printf 'BACKUP_S3_ACCESS_KEY_ID=%s\n' "$BACKUP_S3_ACCESS_KEY_ID"
        printf 'BACKUP_S3_SECRET_ACCESS_KEY=%s\n' "$BACKUP_S3_SECRET_ACCESS_KEY"
      } > "$s3_env"
      scp docker/backup-production.sh "prod:$remote_script"
      ssh prod "umask 077
        secret=\$(mktemp /tmp/dkuoj-s3.XXXXXX)
        cleanup() { rm -f \"\$secret\" '$remote_script'; }
        trap cleanup EXIT HUP INT TERM
        cat > \"\$secret\"
        chmod 700 '$remote_script'
        BACKUP_S3_ENV=\"\$secret\" DKUOJ_IMAGE='$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA' CI_COMMIT_SHORT_SHA='$CI_COMMIT_SHORT_SHA' DATA_DIR='$DATA_DIR' '$remote_script'" < "$s3_env"

deploy:prod:
  extends: .deploy
  environment:
    name: production
    url: https://oj.dukekunshan.edu.cn
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual                             # protected environment + manual gate
  script:
    # Runs on the dev runner, deploys to prod over SSH (key lives on the dev host).
    - export IMG="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - export WSIMG="$CI_REGISTRY_IMAGE/wsevent:$CI_COMMIT_SHORT_SHA"
    - scp docker-compose.yml prod:"$DATA_DIR/docker-compose.yml"
    - >
      ssh prod "cd '$DATA_DIR' &&
      DKUOJ_IMAGE='$IMG' WSEVENT_IMAGE='$WSIMG' docker compose --env-file '$DATA_DIR/.env' pull &&
      DKUOJ_IMAGE='$IMG' WSEVENT_IMAGE='$WSIMG' docker compose --env-file '$DATA_DIR/.env' up -d --remove-orphans"

# ---------------------------------------------------------------------------
# review — AI merge-request review (pr-agent -> school OpenAI-compatible model)
# Runs only on MR events, on the OIT shared runners, and never blocks the MR.
# The model is reached via litellm's `openai/` route ($LLM_API_BASE/chat/completions).
# Secrets come from masked (NOT protected) CI/CD variables — protected vars are not
# injected into the unprotected feature-branch pipelines that MR events run on.
# ---------------------------------------------------------------------------
pr_agent:
  stage: review
  image:
    name: pragent/pr-agent:latest            # pin to a released tag once a version is chosen
    entrypoint: [""]
  needs: []                                   # start immediately; don't wait on lint/test
  variables:
    GIT_STRATEGY: none                        # pr-agent fetches the diff via the API; no clone
    GIT_SUBMODULE_STRATEGY: none
  rules:
    # Skip the develop -> main release-promotion MR (already reviewed into develop).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true                         # a model/API hiccup must never block merging
  script:
    - export config__git_provider="gitlab"
    - export gitlab__url="$CI_SERVER_PROTOCOL://$CI_SERVER_FQDN"   # -> https://gitlab.oit.duke.edu
    - export gitlab__personal_access_token="$GITLAB_PERSONAL_ACCESS_TOKEN"
    # --- school OpenAI-compatible model (litellm 'openai/' route) ---
    - export openai__api_base="$LLM_API_BASE"
    - export openai__key="$LLM_API_KEY"
    - export config__model="$LLM_MODEL"                 # e.g. openai/qwen3.5-27B-FP8
    - export config__fallback_models="[\"$LLM_MODEL\"]" # MUST override (default = unreachable gpt-4*)
    - export config__custom_model_max_tokens="8000"     # model not in litellm's registry
    - export MR_URL="$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
    - cd /app
    - python -m pr_agent.cli --pr_url="$MR_URL" review

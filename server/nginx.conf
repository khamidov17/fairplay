upstream proctora_api {
    server api:8000;          # Docker DNS round-robins across scaled api replicas
    keepalive 256;
}
# Plain HTTP on :80 is for a box behind a TLS-terminating load balancer only. Exposed
# directly, add a `listen 443 ssl;` server with ssl_certificate / ssl_certificate_key and
# make this one `return 301 https://$host$request_uri;` (audit 2026-10-13).
server {
    listen 80;
    # Audit S-11: limits per kind of request, matching the API's own (app/http_guard.py).
    client_max_body_size 10m;            # answers, exams, everything else
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (not append): the API trusts this header for per-IP sign-in limits,
    # so a client must not be able to supply its own.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/exams/[^/]+/scans$ {
        client_max_body_size 250m;       # scanned papers (API limit 200 MB)
        proxy_request_buffering off;     # stream to the API instead of filling nginx's disk
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://proctora_api;
    }
    location = /api/uploads {
        client_max_body_size 10m;        # question images (API limit 5 MB)
        proxy_pass http://proctora_api;
    }
    location / {
        proxy_pass http://proctora_api;
    }
}
# TLS (audit S-17): terminate HTTPS here or in front of this proxy, e.g.
#   listen 443 ssl http2; ssl_certificate /etc/ssl/fairplay/fullchain.pem;
#   ssl_certificate_key /etc/ssl/fairplay/privkey.pem;
# and redirect port 80 to https. The API then sends HSTS (it sees X-Forwarded-Proto https).

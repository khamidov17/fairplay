upstream proctora_api {
    server api:8000;          # Docker DNS round-robins across scaled api replicas
    keepalive 256;
}
server {
    listen 80;
    client_max_body_size 2m;
    location / {
        proxy_pass http://proctora_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # one value, set by us: a client-sent X-Forwarded-For cannot spoof its IP (audit, sign-in limits)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

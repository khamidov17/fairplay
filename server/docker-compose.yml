# Production-shaped stack: API (scale with `docker compose up --scale api=4`), Postgres, Redis, nginx.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: proctora
      # Audit S-17: no default password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a long random string}
      POSTGRES_DB: proctora
    # Pool budget (audit S-17): replicas x WEB_CONCURRENCY x (DB_POOL_SIZE + DB_MAX_OVERFLOW)
    # must stay below max_connections. Defaults: 4 x 4 x (5 + 10) = 240 < 500.
    command: ["postgres", "-c", "max_connections=500", "-c", "shared_buffers=512MB"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proctora"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxclients", "20000"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://proctora:${POSTGRES_PASSWORD}@postgres/proctora
      REDIS_URL: redis://redis:6379/0
      PROCTORA_SECRET: ${PROCTORA_SECRET:?set PROCTORA_SECRET to a long random string}
      # Same value as mac/build.sh FAIRPLAY_APP_KEY (comma-separated during key rotation)
      FAIRPLAY_APP_KEY: ${FAIRPLAY_APP_KEY:?set FAIRPLAY_APP_KEY (see mac/build.sh)}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      # Only nginx reaches the api containers (their port is not published), so its
      # X-Forwarded-For is trusted from any address on this network. The image default is
      # 127.0.0.1 (audit 2026-10-13): never trust client-sent headers by accident.
      FORWARDED_ALLOW_IPS: "*"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      FAIRPLAY_DB_MAX_CONNECTIONS: "450"        # 500 minus room for admin tools
      FAIRPLAY_REPLICAS: ${API_REPLICAS:-4}     # keep equal to --scale api=N
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  nginx:
    image: nginx:1.27
    ports: ["8000:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api]

volumes:
  pgdata:
